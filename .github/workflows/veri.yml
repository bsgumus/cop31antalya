name: Yayınla

# TEİAŞ YTBS yalnız Türkiye'den erişilebiliyor (GitHub'ın sunucularından bağlantı zaman aşımına uğruyor).
# Bu yüzden veri Türkiye'deki bir bilgisayarda veri/yayinla.sh ile 15 dakikada bir çekilip depoya
# gönderilir; bu iş akışı yalnız her gönderimde siteyi GitHub Pages'e yayınlar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: yayin
        uses: actions/deploy-pages@v4
